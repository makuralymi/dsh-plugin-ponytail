# Ponytail whip bundle patch.
#
# Applied after the profile's existing bundle layers (dsh-base, dsh-web-app).
# Inserts exactly one plugin row; the browser half ships through the package's
# `dsh.client` declaration (lib/client.js) and is discovered by the
# client-modules node half, which composes it into window.__DSH_BOOT__.
- insert:
    - id: ui-ponytail
      name: 'dsh-client-ui-ponytail'
